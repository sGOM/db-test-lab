name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dbtestlab
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dbtestlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # 서비스 컨테이너를 쓰므로 Testcontainers 경로는 타지 않는다.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5433/dbtestlab

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: ruff
        run: |
          ruff check .

      - name: pytest
        run: pytest
